<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account | Infinite Magicraid Database</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>
/* Account page: Discord sign-in, then the player's archived Bracket Challenge results. */
#pgbg{display:block;background-image:linear-gradient(rgba(10,10,20,.6),rgba(10,10,20,.82)),url(/img/fbg-hidden-wave.jpg)}
main{max-width:860px;margin:0 auto;position:relative}
.ahead{text-align:center;margin:6px auto 22px}
.ahead h1{font-size:clamp(22px,4.4vw,30px);font-weight:800;margin:4px 0 6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.ahead p{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85);margin:4px 0;font-size:14px}
.abox{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(5px);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.adisc{display:inline-flex;align-items:center;gap:10px;background:#5865F2;color:#fff;text-decoration:none;font:700 15px/1 system-ui,sans-serif;padding:12px 20px;border-radius:999px;border:0;cursor:pointer}
.adisc:hover{background:#4752c4}
.adisc svg{width:22px;height:22px}
.center{text-align:center}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.who img{width:56px;height:56px;border-radius:50%;background:#333}
.who .nm{font-size:20px;font-weight:800}
.who .un{font-size:13px;color:var(--mute)}
.who .sp{flex:1}
.abtn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:8px 14px;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
.abtn.red{border-color:#c0392b;color:#e45b4b}
.ev{border-top:1px solid var(--line);padding:12px 0}
.ev:first-of-type{border-top:0}
.evtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.evn{font-weight:800;font-size:16px}
.evd{font-size:12px;color:var(--mute)}
.pl{font-size:22px;font-weight:800;color:#d9a93a}
.pl small{font-size:13px;color:var(--mute);font-weight:600}
.pts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px;color:var(--mute)}
.pts b{color:inherit}
.note{font-size:13px;color:var(--mute)}
.err{color:#e45b4b}
</style>
</head>
<body class="lbg">
<div id="pgbg"></div>
<main>
<img class="logo" src="/img/logo.png" alt="Infinite Magicraid">
<nav class="ptabs" aria-label="Site sections"><a href="/">Home</a><a href="/heroes/">Heroes</a><a href="/spirit-beasts/">Spirit Beasts</a><a href="/arcane-gems/">Arcane Gems</a><a href="/codes/">Codes</a><a href="/bracket/">Bracket Challenge</a><a class="on" href="/account/" aria-current="page">My Account</a></nav>
<header class="ahead"><h1>My Account</h1><p>Sign in with Discord to see your Championship Bracket Challenge history.</p></header>
<div id="app"><div class="abox center note">Loading…</div></div>
</main>
<script>
(function(){
const app=document.getElementById("app");
const DISC='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1A19.7 19.7 0 0 0 6.1 21l1.3-2.1a12.7 12.7 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.6 19.6 0 0 0 6-2.9c.5-5.2-.8-9.7-3.6-13.7zM8 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
const msg={cancelled:"Sign-in was cancelled.",failed:"Sign-in didn't work. Please try again."}[new URLSearchParams(location.search).get("signin")];
const api=(p,o)=>fetch(p,Object.assign({credentials:"same-origin"},o)).then(r=>r.json());
function signedOut(enabled){
 app.innerHTML='<div class="abox center">'+(msg?'<p class="err">'+msg+'</p>':"")+(enabled?'<a class="adisc" href="/api/auth/discord?next=/account/">'+DISC+'Sign in with Discord</a><p class="note" style="margin-top:12px">We only see your Discord username and avatar. No email, no password, no server access.</p>':'<p class="note">Accounts are coming soon.</p>')+'</div>';
}
function evHtml(b){
 const s=b.score||{total:0,max:0,r1:0,r2:0,r3:0,finals:0};
 const done=b.results&&b.results.champ!=null;
 return '<div class="ev"><div class="evtop"><div><div class="evn">'+esc(b.event)+' · '+esc(b.div)+'</div><div class="evd">Entered as '+esc(b.name)+'</div></div>'+
  '<div class="pl">'+(b.place?ord(b.place):"—")+' <small>of '+b.of+(done?"":" (in progress)")+'</small></div></div>'+
  '<div class="pts"><span><b>'+s.total+'</b> pts</span><span>Round 1: '+s.r1+'</span><span>Round 2: '+s.r2+'</span><span>Round 3: '+s.r3+'</span><span>Finals: '+s.finals+'</span></div></div>';
}
function signedIn(u){
 app.innerHTML='<div class="abox"><div class="who">'+(u.avatar?'<img src="'+esc(u.avatar)+'" alt="">':'')+'<div><div class="nm">'+esc(u.display)+'</div><div class="un">@'+esc(u.username)+'</div></div><span class="sp"></span><button class="abtn" id="out" type="button">Sign out</button></div></div>'+
  '<div class="abox"><h2 style="margin:0 0 6px;font-size:18px">My Bracket Challenge results</h2><div id="brk" class="note">Loading…</div></div>'+
  '<div class="abox"><p class="note" style="margin:0 0 8px">Results are matched to the Discord name you typed on your bracket. Deleting your account removes your sign-in; your entries stay on the event leaderboards.</p><button class="abtn red" id="del" type="button">Delete my account</button></div>';
 document.getElementById("out").onclick=()=>api("/api/auth/logout",{method:"POST"}).then(()=>location.replace("/account/"));
 document.getElementById("del").onclick=()=>{if(confirm("Delete your imrdatabase.com account?"))api("/api/me/delete",{method:"POST"}).then(()=>location.replace("/account/"))};
 api("/api/me/brackets").then(d=>{const el=document.getElementById("brk");const L=(d&&d.brackets)||[];
  el.className="";el.innerHTML=L.length?L.map(evHtml).join(""):'<p class="note">No brackets found for @'+esc(u.username)+' yet. Brackets are saved here from now on, so after your next entry it will show up. Make sure the Discord name on your bracket matches your Discord username.</p>'}).catch(()=>{document.getElementById("brk").textContent="Couldn't load your results."});
}
api("/api/me").then(d=>d&&d.user?signedIn(d.user):signedOut(d&&d.enabled)).catch(()=>signedOut(false));
})();
</script>
</body>
</html>
